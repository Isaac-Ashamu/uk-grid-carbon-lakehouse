# Local platform: Postgres (Airflow metadata + serving marts), Airflow
# (LocalExecutor) running the DAGs, and the read API. The lake lives in ./data
# on the host and is shared by every container.
#
#   docker compose up -d
#   open http://localhost:8080   (airflow / airflow)
#   open http://localhost:8000/docs
#   docker compose run --rm cli backfill 2026-09-01 2026-09-07

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://gridcarbon:gridcarbon@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: UTC
    GRIDCARBON_DATA_ROOT: /opt/gridcarbon/data
    GRIDCARBON_DBT_PROJECT_DIR: /opt/gridcarbon/dbt
    GRIDCARBON_POSTGRES_DSN: postgresql://gridcarbon:gridcarbon@postgres:5432/gridcarbon
    GRIDCARBON_LOG_JSON: "1"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./data:/opt/gridcarbon/data
    - ./dbt:/opt/gridcarbon/dbt
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gridcarbon
      POSTGRES_PASSWORD: gridcarbon
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gridcarbon -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username airflow --password airflow --firstname Air --lastname Flow --role Admin --email airflow@example.com || true
        airflow pools set gridcarbon_warehouse 1 "single DuckDB writer: dbt build and Postgres load serialise here"
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  api:
    build: .
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GRIDCARBON_DATA_ROOT: /opt/gridcarbon/data
      GRIDCARBON_POSTGRES_DSN: postgresql://gridcarbon:gridcarbon@postgres:5432/gridcarbon
      GRIDCARBON_API_BACKEND: postgres
    volumes:
      - ./data:/opt/gridcarbon/data:ro
    ports:
      - "8000:8000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # One-off commands against the same lake, e.g.
  #   docker compose run --rm cli backfill 2026-09-01 2026-09-07
  cli:
    build: .
    profiles: ["tools"]
    entrypoint: ["gridcarbon"]
    environment:
      GRIDCARBON_DATA_ROOT: /opt/gridcarbon/data
      GRIDCARBON_DBT_PROJECT_DIR: /opt/gridcarbon/dbt
      GRIDCARBON_POSTGRES_DSN: postgresql://gridcarbon:gridcarbon@postgres:5432/gridcarbon
    volumes:
      - ./data:/opt/gridcarbon/data
      - ./dbt:/opt/gridcarbon/dbt
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  airflow-logs:

[project]
name = "gridcarbon"
version = "0.1.0"
description = "Medallion lakehouse over the GB Carbon Intensity API and Open-Meteo: bronze/silver/gold, dbt, Airflow, Postgres, FastAPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Isaac Ashamu", email = "inioluwaashamu@gmail.com" }]
dependencies = [
  "httpx>=0.27",
  "tenacity>=8.3",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pandas>=2.2",
  "pyarrow>=16",
  "pandera>=0.20",
  "duckdb>=1.0",
  "typer>=0.12",
  "structlog>=24.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
  "psycopg[binary]>=3.1",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "hypothesis>=6.100",
  "ruff>=0.5",
  "mypy>=1.10",
  "pandas-stubs>=2.2",
  "types-requests",
  "pre-commit>=3.7",
  "httpx>=0.27",
]
airflow = [
  "apache-airflow>=2.9,<3",
]

[project.scripts]
gridcarbon = "gridcarbon.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridcarbon"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "airflow/dags"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W", "SIM", "RUF", "PT", "ISC", "DTZ"]
ignore = ["RUF012", "B008", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src/gridcarbon"]

[[tool.mypy.overrides]]
module = ["pandera.*", "duckdb.*", "pyarrow.*", "structlog.*", "dbt.*", "psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "integration: end-to-end tests that build the whole pipeline on recorded fixtures",
  "postgres: tests that need a live Postgres (set GRIDCARBON_POSTGRES_DSN)",
  "live: tests that call the real public APIs",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["gridcarbon"]
branch = true

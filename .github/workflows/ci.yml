name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: "1"

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv pip install -e ".[dev]"
      - run: ruff check src tests airflow/dags
      - run: ruff format --check src tests airflow/dags
      - run: mypy

  test:
    name: pytest (unit + integration + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gridcarbon
          POSTGRES_PASSWORD: gridcarbon
          POSTGRES_DB: gridcarbon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gridcarbon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GRIDCARBON_POSTGRES_DSN: postgresql://gridcarbon:gridcarbon@localhost:5432/gridcarbon
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv pip install -e ".[dev]"
      - run: pytest -q --cov=gridcarbon --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  dbt:
    name: dbt build on fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv pip install -e ".[dev]"
      - name: Build a 3-day lake offline from the recorded fixtures
        run: |
          python - <<'PY'
          import os, respx
          from datetime import date
          from gridcarbon import pipeline
          from gridcarbon.config import Settings
          from gridcarbon.http import HttpClient
          from tests.conftest import _route_all, days
          os.environ["GRIDCARBON_DATA_ROOT"] = "data"
          s = Settings(); s.ensure_dirs()
          with respx.mock(assert_all_called=False) as r:
              _route_all(r, s)
              with HttpClient(s, sleeper=lambda _: None) as c:
                  out = pipeline.backfill(days(date(2026, 9, 1), 3), settings=s, with_dbt=False, with_serving=False, client=c)
          assert out["failed"] == [], out
          PY
      - run: gridcarbon build
      - run: gridcarbon query "select date_day, periods, mean_actual_gco2_kwh, forecast_mae_gco2_kwh from marts.agg_daily_national"
      - name: dbt docs
        working-directory: dbt
        env:
          GRIDCARBON_DUCKDB_PATH: ${{ github.workspace }}/data/warehouse/gridcarbon.duckdb
        run: dbt docs generate --profiles-dir . --target ci
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  dags:
    name: airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with: { enable-cache: true }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: uv pip install "apache-airflow==2.10.5" --constraint https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt
      - run: uv pip install -e . pytest respx hypothesis
      - run: pytest tests/integration/test_dags.py -q
      - name: airflow dags test (whole daily DAG, offline against fixtures is not possible; parse + render only)
        env:
          AIRFLOW_HOME: /tmp/airflow
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"
        run: |
          airflow db migrate >/dev/null
          airflow dags list
          airflow tasks list gridcarbon_daily --tree

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gridcarbon:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke the image
        run: |
          docker run --rm gridcarbon:ci version
          docker run --rm gridcarbon:ci daily-datasets
      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/airflow.Dockerfile
          push: false
          tags: gridcarbon-airflow:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
